name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout settlemaker (sibling dep)
        uses: actions/checkout@v6
        with:
          repository: barrulus/settlemaker
          ref: master
          path: settlemaker

      - name: Checkout questables
        uses: actions/checkout@v6
        with:
          path: questables

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: questables/package-lock.json

      - name: Build settlemaker
        working-directory: settlemaker
        run: |
          npm ci
          npm run build

      - name: Build questables
        working-directory: questables
        run: |
          npm ci
          npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/settlemaker
            git fetch --prune
            git reset --hard origin/master
            npm ci
            npm run build
            cd ~/questables
            git fetch --prune
            git reset --hard origin/main
            npm ci
            npm run build
            sudo systemctl restart questables.service
            echo "Deploy complete"
